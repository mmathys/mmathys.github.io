<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>max.ax</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="canonical" href="https://github.com/mmathys">
<meta http-equiv="refresh" content="0; url=https://github.com/mmathys">
<script>
  // Redirect immediately. replace() keeps this page out of session history,
  // so the back button returns to where the visitor actually came from.
  window.location.replace("https://github.com/mmathys");
</script>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; margin: 0; background: #fff; color: #111;
  }
  @media (prefers-color-scheme: dark) { body { background: #111; color: #eee; } }
  a { color: inherit; }
</style>
</head>
<body>
  <!-- Shown only if both the script and the meta refresh fail. -->
  <p>Redirecting to <a href="https://github.com/mmathys">github.com/mmathys</a>&hellip;</p>
</body>
</html>
